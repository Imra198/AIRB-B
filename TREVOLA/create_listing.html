<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Listing</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="dashboard-container">

        <!-- Header -->
        <header class="dashboard-header">

            <div>

                <a href="manage-listings.html" class="btn-outline">
                    ← Back to Manage Listings
                </a>

                <h1 class="page-title">
                    Create New Listing
                </h1>

                <p class="page-subtitle">
                    Fill in your property information and upload the required media.
                </p>

            </div>

        </header>

        <!-- Listing Form -->
        <div class="listing-form-card">

            <form id="createListing">

                <!-- Property Title -->
                <div class="input-group">
                    <label for="title">Property Title</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. Luxury Apartment in London"
                        required>
                </div>

                <!-- Description -->
                <div class="input-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Describe your property, nearby attractions and facilities..."
                        required></textarea>

                </div>

                <!-- Category -->
                <div class="input-group">

                    <label for="category">
                        Property Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select a category
                        </option>

                        <option value="professional">
                            Professional
                        </option>

                        <option value="family">
                            Family
                        </option>

                        <option value="adventure">
                            Adventure
                        </option>

                    </select>

                </div>

                <!-- Address -->
                <div class="input-group">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="123 Example Street"
                        required>

                </div>

                <!-- Latitude & Longitude -->
                <div class="location-grid">

                    <div class="input-group">

                        <label for="latitude">
                            Latitude
                        </label>

                        <input
                            type="number"
                            step="any"
                            id="latitude"
                            placeholder="51.5074"
                            required>

                    </div>

                    <div class="input-group">

                        <label for="longitude">
                            Longitude
                        </label>

                        <input
                            type="number"
                            step="any"
                            id="longitude"
                            placeholder="-0.1278"
                            required>

                    </div>

                </div>

                <!-- Price -->
                <div class="input-group">

                    <label for="price">
                        Price Per Night (£)
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="1"
                        placeholder="150"
                        required>

                </div>

                <!-- Amenities -->
                <div class="input-group">

                    <label for="amenities">
                        Amenities
                    </label>

                    <input
                        type="text"
                        id="amenities"
                        placeholder="Wi-Fi, Kitchen, Parking, Pool..."
                        required>

                </div>

                <!-- Upload -->
                <div class="upload-box">

                    <label for="images">

                        <h3>Upload Property Media</h3>

                        <p>
                            Select both images and videos.
                        </p>

                    </label>

                    <input
                        type="file"
                        id="images"
                        multiple
                        accept="image/*,video/*"
                        required>

                </div>

                <!-- Preview Area -->
                <div id="mediaPreview" class="media-preview">

                </div>

                <!-- Upload Status -->
                <div id="mediaStatus" class="requirements-card">

                    <h3>Trevola Media Requirements</h3>

                    <ul>

                        <li>✅ Minimum 8 Images</li>

                        <li>✅ Minimum 4 Videos</li>

                        <li>✅ Images up to 10MB each</li>

                        <li>✅ Videos up to 50MB each</li>

                    </ul>

                </div>

                <!-- Buttons -->
                <div class="form-actions">

                    <a href="manage-listings.html"
                        class="btn-outline">

                        Cancel

                    </a>

                    <button
                        type="submit"
                        class="btn-neon">

                        Create Listing

                    </button>

                </div>

            </form>

        </div>

    </div>

    <script type="module" src="listing-logic.js"></script>

</body>

</html>
